name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json

      - name: No comments (CLA-0035)
        run: node scripts/no-comments.mjs

      - name: Script tests
        run: node --test "scripts/*.test.mjs"

      - name: Restore
        run: dotnet restore Claudalisk.Dotnet.slnx --locked-mode

      - name: Build
        run: dotnet build Claudalisk.Dotnet.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution Claudalisk.Dotnet.slnx --configuration Release --no-build

      - name: Pack
        run: dotnet pack Claudalisk.Dotnet.slnx --configuration Release --no-build --output artifacts
